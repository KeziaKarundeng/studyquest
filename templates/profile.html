{% extends "base.html" %}

{% block content %}
<h2><i class="fas fa-user"></i> Profil Saya</h2>

{% if session.get('preview_as_dosen') %}<p class="form-hint">Mode preview: profil hanya bisa dilihat.</p>{% endif %}
<form id="profile-form">
    <fieldset class="upload-fields" {{ 'disabled' if session.get('preview_as_dosen') }}>
    <input type="hidden" id="user-id">
    
    <div class="form-row">
        <div class="form-group">
            <label>Nama *</label>
            <input type="text" id="profile-name" required>
        </div>
        <div class="form-group">
            <label>Avatar</label>
            <select id="profile-avatar">
                <option value="avatar1">Avatar 1</option>
                <option value="avatar2">Avatar 2</option>
                <option value="avatar3">Avatar 3</option>
                <option value="avatar4">Avatar 4</option>
            </select>
        </div>
    </div>
    
    <button type="submit" class="btn-submit">Simpan Perubahan</button>
</fieldset>
</form>

<div class="profile-preview" id="profile-preview">
    <div class="preview-avatar" id="preview-avatar"></div>
    <span id="preview-name">Mahasiswa</span>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Load current profile
    api('/api/profile')
        .then(data => {
            if (data.status === 'sukses') {
                const user = data.user;
                document.getElementById('profile-name').value = user.name || 'Mahasiswa';
                document.getElementById('profile-avatar').value = user.avatar || 'avatar1';
                
                // Update preview
                updatePreview(user.name, user.avatar);
            }
        }).catch(error => feedback(error.message, true));
});

function updatePreview(name, avatar) {
    const previewAvatar = document.getElementById('preview-avatar');
    const previewName = document.getElementById('preview-name');
    
    previewAvatar.className = 'preview-avatar ' + avatar;
    previewName.textContent = name || 'Mahasiswa';
}

document.getElementById('profile-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const button = this.querySelector('[type="submit"]');
    if (button.disabled) return;
    button.disabled = true;
    try {
        const data = await api('/api/profile', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: document.getElementById('profile-name').value,
                                  avatar: document.getElementById('profile-avatar').value})
        });
        feedback('Profil tersimpan. Makin kamu banget!');
        updatePreview(data.user.name, data.user.avatar);
        document.querySelector('.sidebar-footer p').textContent = data.user.name;
    } catch (error) {
        feedback(error.message, true);
    } finally {
        button.disabled = false;
    }
});
</script>
{% endblock %}
