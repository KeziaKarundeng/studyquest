{% extends "base.html" %}

{% block content %}
<h2><i class="fas fa-user"></i> Profil Saya</h2>

<form profile-form id="profile-form">
    <input type="hidden" id="user-id">
    
    <div class="form-row">
        <div class="form-group">
            <label>Nama *</label>
            <input type="text" id="profile-name" required>
        </div>
        <div class="form-group">
            <label>Avatar</label>
            <select id="profile-avatar">
                <option value="avatar1">Avatar 1</option>
                <option value="avatar2">Avatar 2</option>
                <option value="avatar3">Avatar 3</option>
                <option value="avatar4">Avatar 4</option>
            </select>
        </div>
    </div>
    
    <button type="submit" class="btn-submit">Simpan Perubahan</button>
</form>

<div class-profile-preview" id="profile-preview">
    <div class="preview-avatar" id="preview-avatar"></div>
    <span id="preview-name">Mahasiswa</span>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Load current profile
    fetch('/api/profile', { method: 'GET' })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'sukses') {
                const user = data.user;
                document.getElementById('profile-name').value = user.name || 'Mahasiswa';
                document.getElementById('profile-avatar').value = user.avatar || 'avatar1';
                
                // Update preview
                updatePreview(user.name, user.avatar);
            }
        });
});

function updatePreview(name, avatar) {
    const previewAvatar = document.getElementById('preview-avatar');
    const previewName = document.getElementById('preview-name');
    
    previewAvatar.className = 'preview-avatar ' + avatar;
    previewName.textContent = name || 'Mahasiswa';
}

document.getElementById('profile-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const name = document.getElementById('profile-name').value;
    const avatar = document.getElementById('profile-avatar').value;
    
    fetch('/api/profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, avatar: avatar })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'sukses') {
            alert('Profil berhasil disimpan!');
            updatePreview(name, avatar);
        } else {
            alert('Error: ' + data.pesan);
        }
    });
});
</script>
{% endblock %}
