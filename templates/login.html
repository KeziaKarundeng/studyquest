<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyQuest - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <div class="role-logo">
                    <i class="fas fa-gamepad"></i>
                </div>
                <h1>StudyQuest</h1>
                <p class="role-subtitle">Kuliah Jadi Game</p>
            </div>

            {% if error %}
            <div class="login-error">
                <i class="fas fa-exclamation-circle"></i> {{ error }}
            </div>
            {% endif %}

            <div class="login-tabs">
                <button type="button" class="login-tab {% if active_tab != 'mahasiswa' %}active{% endif %}" id="tab-dosen" onclick="switchTab('dosen')">
                    <i class="fas fa-chalkboard-teacher"></i> Dosen
                </button>
                <button type="button" class="login-tab {% if active_tab == 'mahasiswa' %}active{% endif %}" id="tab-mahasiswa" onclick="switchTab('mahasiswa')">
                    <i class="fas fa-user-graduate"></i> Mahasiswa
                </button>
            </div>

            <div class="login-form-wrapper">
                <form method="POST" action="{{ url_for('do_login') }}" class="login-form {% if active_tab != 'mahasiswa' %}active{% endif %}" id="form-dosen">
                    <input type="hidden" name="role" value="dosen">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Username</label>
                        <input type="text" name="username" placeholder="Masukkan username" required autofocus>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <input type="password" name="password" placeholder="Masukkan password" required>
                    </div>
                    <button type="submit" class="btn-login btn-dosen">
                        <i class="fas fa-sign-in-alt"></i> Masuk sebagai Dosen
                    </button>
                </form>

                <form method="POST" action="{{ url_for('do_login') }}" class="login-form {% if active_tab == 'mahasiswa' %}active{% endif %}" id="form-mahasiswa">
                    <input type="hidden" name="role" value="mahasiswa">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Nama Lengkap</label>
                        <input type="text" name="nama" placeholder="Contoh: Kezia Karundeng" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-id-card"></i> NIM</label>
                        <input type="text" name="nim" placeholder="Contoh: 25210136" required>
                    </div>
                    <button type="submit" class="btn-login btn-mahasiswa">
                        <i class="fas fa-sign-in-alt"></i> Masuk sebagai Mahasiswa
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
    function switchTab(role) {
        document.getElementById('tab-dosen').classList.toggle('active', role === 'dosen');
        document.getElementById('tab-mahasiswa').classList.toggle('active', role === 'mahasiswa');
        document.getElementById('form-dosen').classList.toggle('active', role === 'dosen');
        document.getElementById('form-mahasiswa').classList.toggle('active', role === 'mahasiswa');
    }
    </script>
</body>
</html>
